<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOJO的南外打卡</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 1400px; margin: 0 auto; }

  .header {
    background: white;
    border-radius: 20px;
    padding: 35px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .header h1 { font-size: 2.6em; color: #333; margin-bottom: 10px; }
  .header .subtitle { color: #666; font-size: 1.3em; }
  .stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 25px;
    flex-wrap: wrap;
  }
  .stat-box {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    border-radius: 15px;
    padding: 15px 25px;
    color: white;
    text-align: center;
    min-width: 110px;
  }
  .stat-box.green { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
  .stat-box.blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
  .stat-box.orange { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
  .stat-box.gold { background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%); color: #333; }
  .stat-box .number { font-size: 2.2em; font-weight: bold; }
  .stat-box .label { font-size: 1em; opacity: 0.9; }
  .stat-box.sync { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); cursor: pointer; }
  .stat-box.sync:hover { transform: scale(1.05); }
  .cloud-btns { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
  .cloud-btn { background: #f0f0ff; border: 2px solid #667eea; border-radius: 12px; padding: 8px 18px; font-size: 0.95em; cursor: pointer; color: #667eea; font-weight: bold; transition: all 0.2s; }
  .cloud-btn:hover { background: #667eea; color: white; }

  .tab-nav {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: white;
    border: none;
    padding: 14px 28px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 1.15em;
    font-weight: bold;
    color: #666;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  .tab-btn:hover { transform: translateY(-2px); }
  .tab-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
  }

  .main-content {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    display: none;
  }
  .main-content.active { display: block; }

  .week-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .week-tab {
    background: #f0f0f0;
    border: none;
    padding: 12px 24px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 1.1em;
    font-weight: bold;
    color: #666;
    transition: all 0.3s;
  }
  .week-tab:hover { background: #e0e0e0; }
  .week-tab.active {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
  }

  .day-card {
    background: #f8f9fa;
    border-radius: 15px;
    margin-bottom: 18px;
    border-left: 6px solid #ddd;
    overflow: hidden;
    transition: all 0.3s;
  }
  .day-card:hover { box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
  .day-card.completed { border-left-color: #38ef7d; }
  .day-card.special-day {
    background: linear-gradient(135deg, #fff9c4, #fff3e0, #fce4ec);
    border-left-color: #f44336;
  }
  .day-card.exam-day {
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9, #a5d6a7);
    border-left-color: #4caf50;
  }

  .date-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px;
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    border-bottom: 1px solid #dee2e6;
    flex-wrap: wrap;
    gap: 10px;
  }
  .day-card.completed .date-row { background: linear-gradient(135deg, #d4edda, #c3e6cb); }
  .day-card.special-day .date-row,
  .day-card.exam-day .date-row { background: transparent; border-bottom: none; }
  .date-info { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .date-text { font-size: 1.6em; font-weight: bold; color: #333; }
  .weekday-text { font-size: 1.3em; color: #667eea; font-weight: bold; }
  .day-badge { padding: 5px 16px; border-radius: 20px; font-size: 1em; font-weight: bold; }
  .day-badge.class { background: #fff3cd; color: #856404; }
  .day-badge.exam { background: #f8d7da; color: #721c24; }
  .day-badge.school { background: #d4edda; color: #155724; }
  .day-badge.sprint { background: #e1bee7; color: #6a1b9a; }
  .date-progress-mini { font-size: 1.05em; color: #666; }
  .date-progress-mini strong { color: #38ef7d; }

  .cheer-msg {
    padding: 8px 22px;
    background: linear-gradient(90deg, #fff9c4, #fff3e0);
    font-size: 1.05em;
    color: #e65100;
    border-bottom: 1px solid #ffe0b2;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cheer-emoji { font-size: 1.3em; }

  .big-cheer {
    padding: 30px 25px;
    text-align: center;
    font-size: 1.4em;
    line-height: 2;
    color: #333;
  }
  .big-cheer .big-emoji { font-size: 2.5em; display: block; margin-bottom: 10px; }
  .big-cheer .big-text { font-weight: bold; font-size: 1.2em; }
  .big-cheer .sub-text { font-size: 0.85em; color: #888; margin-top: 5px; }

  .task-section { padding: 12px 18px 6px; }
  .task-section-header {
    font-size: 1em;
    font-weight: bold;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-icon {
    width: 22px; height: 22px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; font-size: 0.8em;
  }
  .task-section.sec-school .task-section-header { color: #27ae60; }
  .task-section.sec-school .section-icon { background: #27ae60; color: white; }
  .task-section.sec-english .task-section-header { color: #e74c3c; }
  .task-section.sec-english .section-icon { background: #e74c3c; color: white; }
  .task-section.sec-math .task-section-header { color: #3498db; }
  .task-section.sec-math .section-icon { background: #3498db; color: white; }
  .task-section.sec-other .task-section-header { color: #f39c12; }
  .task-section.sec-other .section-icon { background: #f39c12; color: white; }

  .task-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding-bottom: 6px;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    background: white;
    border-radius: 25px;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px solid transparent;
    font-size: 1.05em;
    user-select: none;
  }
  .task-item:hover { border-color: #ddd; transform: scale(1.03); }
  .task-item.in-progress {
    border-color: #ff9800;
    background: #fff3e0;
    animation: pulse-border 2s ease-in-out infinite;
  }
  .task-item.done {
    background: #e8f5e9;
    border-color: #4caf50;
    text-decoration: line-through;
    opacity: 0.7;
  }
  @keyframes pulse-border {
    0%, 100% { border-color: #ff9800; box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.4); }
    50% { border-color: #ff6f00; box-shadow: 0 0 0 4px rgba(255, 152, 0, 0.1); }
  }

  .task-check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #ccc;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s; flex-shrink: 0; font-size: 0.75em;
  }
  .task-item.in-progress .task-check {
    border-color: #ff9800;
    background: #fff3e0;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }
  .task-item.done .task-check {
    background: #4caf50;
    border-color: #4caf50;
  }
  .task-item.done .task-check::after { content: "\2713"; color: white; }
  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .task-text { white-space: nowrap; }
  .task-points {
    background: #fff3cd; padding: 2px 9px; border-radius: 10px;
    font-size: 0.8em; color: #856404;
  }
  .task-timer {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-left: 6px;
    background: linear-gradient(135deg, #ff9800, #ff5722);
    color: white;
    padding: 6px 12px;
    border-radius: 12px;
    min-width: 90px;
    text-align: center;
    font-size: 1.3em;
    font-weight: bold;
    letter-spacing: 0.03em;
    box-shadow: 0 2px 8px rgba(255,152,0,0.4);
    animation: timerPulse 1.5s ease-in-out infinite;
  }
  .task-timer .timer-start {
    font-size: 0.55em;
    font-weight: normal;
    opacity: 0.9;
    margin-bottom: 1px;
  }
  .task-timer .timer-elapsed {
    font-size: 1em;
    font-weight: bold;
    line-height: 1.2;
  }
  .task-timer .timer-label {
    font-size: 0.5em;
    opacity: 0.85;
    margin-top: 1px;
  }
  @keyframes timerPulse {
    0%, 100% { box-shadow: 0 2px 8px rgba(255,152,0,0.4); transform: scale(1); }
    50% { box-shadow: 0 4px 20px rgba(255,152,0,0.7); transform: scale(1.02); }
  }
  .task-done-time {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-left: 6px;
    background: #e8f5e9;
    color: #388e3c;
    padding: 4px 10px;
    border-radius: 10px;
    min-width: 80px;
    font-size: 0.82em;
    font-weight: bold;
  }
  .task-done-time .done-times {
    font-size: 0.9em;
    color: #888;
    font-weight: normal;
  }
  .task-done-time .done-dur {
    color: #388e3c;
    font-size: 1.1em;
  }

  .custom-task-input {
    display: flex;
    gap: 8px;
    align-items: center;
    padding-bottom: 6px;
    flex-wrap: wrap;
  }
  .custom-task-input input[type="text"] {
    padding: 8px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 15px;
    font-size: 1em;
    width: 180px;
    outline: none;
    font-family: inherit;
  }
  .custom-task-input input[type="text"]:focus { border-color: #f39c12; }
  .custom-task-input input[type="number"] {
    padding: 8px 10px;
    border: 2px solid #e0e0e0;
    border-radius: 15px;
    font-size: 1em;
    width: 70px;
    outline: none;
    font-family: inherit;
  }
  .custom-task-input input[type="number"]:focus { border-color: #f39c12; }
  .custom-add-btn {
    padding: 8px 16px;
    background: #f39c12;
    color: white;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    font-size: 1em;
    font-weight: bold;
    transition: all 0.3s;
  }
  .custom-add-btn:hover { background: #e67e22; }

  .day-progress {
    padding: 10px 22px;
    background: white;
    border-top: 1px solid #eee;
  }
  .progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: 3px; transition: width 0.5s ease;
    background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
  }
  .progress-fill.complete { background: linear-gradient(90deg, #11998e, #38ef7d); }

  .day-summary {
    padding: 10px 22px;
    background: linear-gradient(135deg, #f0f4ff, #e8ecf8);
    border-top: 1px solid #dde;
    font-size: 1.05em;
    color: #667eea;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .day-summary .summary-label { font-weight: bold; }
  .day-summary .summary-value { font-weight: bold; color: #333; }

  .rewards-shop h2 { font-size: 1.8em; color: #333; margin-bottom: 5px; }
  .rewards-balance {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    padding: 18px 24px; border-radius: 15px; margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
  }
  .balance-info { color: #333; }
  .balance-info .amount { font-size: 2.2em; font-weight: bold; }
  .balance-info .label { font-size: 1em; }
  .balance-spent { font-size: 1em; color: #666; }

  .reward-categories { margin-bottom: 20px; }
  .reward-cat-title {
    font-size: 1.2em; font-weight: bold; margin: 18px 0 12px;
    padding-bottom: 6px; border-bottom: 2px solid #eee;
    display: flex; align-items: center; gap: 8px;
  }
  .reward-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .reward-card {
    background: #f8f9fa; border-radius: 12px; padding: 18px;
    border: 2px solid #eee; transition: all 0.3s; text-align: center;
  }
  .reward-card:hover { border-color: #f39c12; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
  .reward-card .reward-icon { font-size: 2.5em; margin-bottom: 10px; }
  .reward-card .reward-name { font-size: 1.1em; font-weight: bold; color: #333; margin-bottom: 5px; }
  .reward-card .reward-cost {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    padding: 4px 12px; border-radius: 10px; font-size: 0.9em;
    font-weight: bold; color: #333; display: inline-block; margin-bottom: 10px;
  }
  .reward-card .reward-desc { font-size: 0.9em; color: #888; margin-bottom: 12px; }
  .reward-btn {
    padding: 8px 20px; border: none; border-radius: 15px;
    cursor: pointer; font-size: 1em; font-weight: bold; transition: all 0.3s;
    background: linear-gradient(135deg, #667eea, #764ba2); color: white;
  }
  .reward-btn:hover { transform: scale(1.05); }
  .reward-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

  .redeem-history { margin-top: 25px; }
  .redeem-history h3 { margin-bottom: 12px; color: #333; font-size: 1.2em; }
  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: #f8f9fa; border-radius: 10px;
    margin-bottom: 8px; font-size: 1em;
  }
  .history-item .hi-name { font-weight: bold; }
  .history-item .hi-cost { color: #e74c3c; font-weight: bold; }
  .history-item .hi-date { color: #999; font-size: 0.9em; }

  .legend {
    display: flex; justify-content: center; gap: 24px; margin-top: 20px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 1em; color: #333; }
  .legend-color { width: 18px; height: 18px; border-radius: 4px; }
  .legend-color.school { background: #27ae60; }
  .legend-color.english { background: #e74c3c; }
  .legend-color.math { background: #3498db; }
  .legend-color.other { background: #f39c12; }

  .empty-state { text-align: center; padding: 40px; color: #999; font-size: 1.1em; }
  .empty-state .icon { font-size: 3em; margin-bottom: 15px; }

  @media (max-width: 768px) {
    .header h1 { font-size: 1.8em; }
    .stats { gap: 10px; }
    .stat-box { min-width: 80px; padding: 10px 14px; }
    .stat-box .number { font-size: 1.6em; }
    .task-item { padding: 7px 10px; font-size: 0.95em; }
    .reward-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }

  .exam-cheer { background: linear-gradient(135deg, #1a237e, #283593, #3949ab) !important; }
  .exam-cheer .big-emoji { font-size: 2.5em; }
  .exam-cheer .big-text { font-size: 1.4em; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  .exam-cheer .sub-text { color: rgba(255,255,255,0.9); font-size: 0.95em; }
  .exam-cheer-btn {
    margin-top: 10px; padding: 7px 18px;
    border: 2px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.15); color: white;
    border-radius: 20px; font-size: 0.9em; cursor: pointer; transition: all 0.2s;
  }
  .exam-cheer-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }

</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎯 JOJO的南外打卡</h1>
    <div class="subtitle">考试倒计时：<strong id="countdown">47天</strong> | 逐梦南外，不负韶华！✨ Believe in yourself!</div>
    <div class="stats">
      <div class="stat-box blue">
        <div class="number" id="totalPoints">0</div>
        <div class="label">累计积分</div>
      </div>
      <div class="stat-box gold">
        <div class="number" id="availablePoints">0</div>
        <div class="label">可用积分</div>
      </div>
      <div class="stat-box green">
        <div class="number" id="streak">0</div>
        <div class="label">连续打卡</div>
      </div>
      <div class="stat-box orange">
        <div class="number" id="completedDays">0</div>
        <div class="label">已完成天数</div>
      </div>
      <div class="stat-box sync" onclick="manualSync()" title="点击手动同步">
        <div class="number" id="syncStatus" style="font-size:1.5em">-</div>
        <div class="label">云端同步</div>
      </div>
    </div>
    <div class="cloud-btns">
      <button class="cloud-btn" onclick="exportData()">📤 导出数据</button>
      <button class="cloud-btn" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
      <button class="cloud-btn" onclick="showSyncCode()">🔗 同步码</button>
      <button class="cloud-btn" onclick="enterSyncCode()">📱 输入同步码</button>
    </div>
  </div>

  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('checkin')">📋 每日打卡</button>
    <button class="tab-btn" onclick="switchTab('rewards')">🎁 积分兑换</button>
  </div>

  <div class="main-content active" id="checkinTab">
    <div class="week-tabs" id="weekTabs"></div>
    <div id="weekContent"></div>
  </div>

  <div class="main-content" id="rewardsTab">
    <div class="rewards-shop">
      <h2>🎁 积分兑换小商店</h2>
      <p style="color:#888;font-size:1em;margin-bottom:15px;">好好学习，兑换心仪的奖励！同一奖品可以多次兑换哦～</p>
      <div class="rewards-balance">
        <div class="balance-info">
          <div class="label">可用积分</div>
          <div class="amount" id="rewardBalance">0</div>
        </div>
        <div class="balance-spent">已消费：<strong id="rewardSpent">0</strong> 积分</div>
      </div>
      <div class="reward-categories">
        <div class="reward-cat-title">🧁 小确幸（随时兑换）</div>
        <div class="reward-grid" id="rewardGridSmall"></div>
        <div class="reward-cat-title">🎉 小期待（攒几天就能换）</div>
        <div class="reward-grid" id="rewardGridMedium"></div>
        <div class="reward-cat-title">🏆 大梦想（坚持努力换大礼）</div>
        <div class="reward-grid" id="rewardGridLarge"></div>
      </div>
      <div class="redeem-history">
        <h3>📜 兑换记录</h3>
        <div id="redeemHistory">
          <div class="empty-state" style="padding:20px;"><div>还没有兑换记录</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-color school"></div> 校内</div>
    <div class="legend-item"><div class="legend-color english"></div> 英语</div>
    <div class="legend-item"><div class="legend-color math"></div> 数思</div>
    <div class="legend-item"><div class="legend-color other"></div> 其他</div>
  </div>
</div>

// 过去日期密码保护：记录已验证通过的过去日期
var validatedPastDays = {};

function isPastDay(dayKey) {
  // dayKey格式: "5/11-周一"  提取月/日
  var parts = dayKey.split("-");
  if (parts.length < 2) return false;
  var md = parts[0].split("/"); // ["5","11"]
  if (md.length < 2) return false;
  var m = parseInt(md[0]), d = parseInt(md[1]);
  var today = new Date();
  var todayM = today.getMonth() + 1, todayD = today.getDate();
  if (m < todayM) return true;
  if (m === todayM && d < todayD) return true;
  return false;
}

function requirePastPassword(dayKey) {
  if (!isPastDay(dayKey)) return true;
  if (validatedPastDays[dayKey]) return true;
  var p = prompt("📅 「" + dayKey + "」是过去的日期，\n请输入密码继续操作：");
  if (p === "20221105") {
    validatedPastDays[dayKey] = true;
    return true;
  }
  if (p !== null) alert("密码错误！");
  return false;
}

function dateKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function isMockExam(d) { return MOCK_EXAM_DATES.indexOf(dateKey(d)) !== -1; }

      tasks.push({text:"复习错题本（只看不做新题）",type:"other",section:"其他",points:20});

      tasks.push({text:"门萨10题",type:"math",section:"数思",points:5});

      if (isWednesday) { badges.push("🎯 学校模考日"); }
      if (hasAngGuoClass) { badges.push("昂果上课 17:20-21:10"); type = "class"; }
      if (hasZhiNanZhenClass) { badges.push("指南针上课 13:30-17:00"); type = "class"; }

  if (userId) saveToCloud(userId);
  updateStats();
}

// Cloud sync functions
var SYNC_URL_BASE = '';
function setSyncBase(url) { SYNC_URL_BASE = url; }

async function saveToCloud(userId) {
  if (!SYNC_URL_BASE) return;
  try {
    var resp = await fetch(SYNC_URL_BASE + '/.netlify/functions/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: userId, state: state })
    });
    if (resp.ok) {
      var el = document.getElementById('syncStatus');
      if (el) el.textContent = '已同步';
    }
  } catch(e) {
    var el = document.getElementById('syncStatus');
    if (el) el.textContent = '离线';
  }
}

async function loadFromCloud(userId) {
  if (!SYNC_URL_BASE) {
    var el = document.getElementById('syncStatus');
    if (el) el.textContent = '本地模式';
    return;
  }
  try {
    var resp = await fetch(SYNC_URL_BASE + '/.netlify/functions/load?userId=' + encodeURIComponent(userId));
    if (resp.ok) {
      var data = await resp.json();
      if (data.state) {
        var cloudState = data.state;
        var localSaved = localStorage.getItem("studyTrackerState_v8");
        var localState = localSaved ? JSON.parse(localSaved) : null;
        if (cloudState.lastSynced && (!localState || !localState.lastSynced || new Date(cloudState.lastSynced) > new Date(localState.lastSynced))) {
          state = cloudState;
          localStorage.setItem("studyTrackerState_v8", JSON.stringify(state));
          renderDays();
          updateStats();
        }
        var el = document.getElementById('syncStatus');
        if (el) el.textContent = '云端同步成功';
      } else {
        var el2 = document.getElementById('syncStatus');
        if (el2) el2.textContent = '云端无数据';
      }
    } else {
      var el3 = document.getElementById('syncStatus');
      if (el3) el.textContent = '同步失败(' + resp.status + ')';
    }
  } catch(e) {
    var el = document.getElementById('syncStatus');
    if (el) el.textContent = '离线';
  }
}

function exportData() {
  var dataStr = JSON.stringify(state, null, 2);
  var blob = new Blob([dataStr], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'jojo_checkin_backup_' + new Date().toISOString().substr(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(fileInput) {
  var file = fileInput.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var imported = JSON.parse(e.target.result);
      state = imported;
      localStorage.setItem("studyTrackerState_v8", JSON.stringify(state));
      alert('导入成功！');
      location.reload();
    } catch(err) {
      alert('导入失败：文件格式错误');
    }
  };
  reader.readAsText(file);
}

function formatDuration(ms) {
  if (ms <= 0) return "0秒";
  var totalSec = Math.floor(ms / 1000);
  var h = Math.floor(totalSec / 3600);
  var m = Math.floor((totalSec % 3600) / 60);
  var s = totalSec % 60;
  var parts = [];
  if (h > 0) parts.push(h + "小时");
  if (m > 0) parts.push(m + "分");
  if (h === 0) parts.push(s + "秒");
  return parts.join("");
}

function formatTime(ts) {
  var d = new Date(ts);
  return (d.getHours() + "").padStart(2, "0") + ":" + (d.getMinutes() + "").padStart(2, "0");
}

function getTaskState(dayKey, idx) {
  if (!state.dayStates[dayKey]) return 0;
  return state.dayStates[dayKey].tasks[idx] || 0;
  // 0=pending, 1=in-progress, 2=done
}

function toggleTask(dayKey, taskIdx, points) {
  if (!requirePastPassword(dayKey)) return;
  if (!state.dayStates[dayKey]) state.dayStates[dayKey] = {tasks:{}};
  var currentState = state.dayStates[dayKey].tasks[taskIdx] || 0;
  if (currentState === 0) {
    // 开始计时：检查并自动完成同天其他进行中的任务
    var inProg = state.dayStates[dayKey].tasks;
    for (var k in inProg) {
      if (k.indexOf("_dur") === -1 && k.indexOf("_start") === -1 && inProg[k] === 1) {
        var prevPoints = 10;
        for (var di = 0; di < CONFIG.days.length; di++) {
          var dk2 = CONFIG.days[di].date + "-" + CONFIG.days[di].day;
          if (dk2 === dayKey) { prevPoints = CONFIG.days[di].tasks[k] ? CONFIG.days[di].tasks[k].points : 10; break; }
        }
        inProg[k] = 2;
        inProg[k + "_dur"] = Date.now() - (inProg[k + "_start"] || Date.now());
        state.totalPoints += prevPoints;
      }
    }
    state.dayStates[dayKey].tasks[taskIdx] = 1;
    state.dayStates[dayKey].tasks[taskIdx + "_start"] = Date.now();
  } else if (currentState === 1) {
    var endTime = Date.now();
    var dur = endTime - (state.dayStates[dayKey].tasks[taskIdx + "_start"] || endTime);
    state.dayStates[dayKey].tasks[taskIdx] = 2;
    state.dayStates[dayKey].tasks[taskIdx + "_dur"] = dur;
    state.dayStates[dayKey].tasks[taskIdx + "_endTime"] = endTime;
    state.totalPoints += points;
  } else {
    if (!confirm("确定要重置「" + CONFIG.days.map(function(d){return d.date+"-"+d.day;}).indexOf(dayKey) + "」吗？这会扣除" + points + "积分和已记录的时间。")) return;
    state.dayStates[dayKey].tasks[taskIdx] = 0;
    delete state.dayStates[dayKey].tasks[taskIdx + "_start"];
    delete state.dayStates[dayKey].tasks[taskIdx + "_dur"];
    state.totalPoints -= points;
  }
  updateStreak();
  saveState();
  renderWeek(state.currentWeek);
}

function addCustomTask(dayKey) {
  if (!requirePastPassword(dayKey)) return;

  var text = textEl.value.trim();
  var points = parseInt(ptsEl.value) || 5;
  var section = catEl ? catEl.value : "其他";
  if (!text) { alert("请填写完成内容"); return; }
  if (!state.customTasks[dayKey]) state.customTasks[dayKey] = [];
  state.customTasks[dayKey].push({text:text, points:points, section:section, done:false, timerState:0, startTime:null, endTime:null});
  textEl.value = ""; ptsEl.value = "5";
  saveState(); renderWeek(state.currentWeek);
}

function toggleCustomTask(dayKey, customIdx) {
  var ct = state.customTasks[dayKey] && state.customTasks[dayKey][customIdx];
  if (!ct) return;
  if (ct.timerState === 0) {
    // 开始计时：先自动完成同一天其他进行中的任务
    var customList = state.customTasks[dayKey] || [];
    for (var ci = 0; ci < customList.length; ci++) {
      if (ci !== customIdx && customList[ci].timerState === 1) {
        customList[ci].timerState = 2;
        customList[ci].endTime = Date.now();
        state.totalPoints += customList[ci].points;
      }
    }
    var dayState = state.dayStates[dayKey] && state.dayStates[dayKey].tasks;
    if (dayState) {
      for (var k in dayState) {
        if (k.indexOf("_dur") === -1 && k.indexOf("_start") === -1 && dayState[k] === 1) {
          var prevPoints = 10;
          for (var di = 0; di < CONFIG.days.length; di++) {
            var dk2 = CONFIG.days[di].date + "-" + CONFIG.days[di].day;
            if (dk2 === dayKey) { prevPoints = CONFIG.days[di].tasks[k] ? CONFIG.days[di].tasks[k].points : 10; break; }
          }
          dayState[k] = 2;
          dayState[k + "_dur"] = Date.now() - (dayState[k + "_start"] || Date.now());
          state.totalPoints += prevPoints;
        }
      }
    }
    ct.timerState = 1;
    ct.startTime = Date.now();
    ct.endTime = null;
  } else if (ct.timerState === 1) {
    ct.timerState = 2;
    ct.endTime = Date.now();
    state.totalPoints += ct.points;
  } else {
    if (!confirm("确定要重置「" + ct.text + "」吗？这会扣除" + ct.points + "积分和已记录的时间。")) return;
    ct.timerState = 0;
    ct.startTime = null;
    ct.endTime = null;
    state.totalPoints -= ct.points;
  }
  updateStreak();
  saveState();
  renderWeek(state.currentWeek);
}

function removeCustomTask(dayKey, customIdx) {
  if (!requirePastPassword(dayKey)) return;
  var ct = state.customTasks[dayKey] && state.customTasks[dayKey][customIdx];
  if (!ct) return;
  if (ct.timerState === 2) state.totalPoints -= ct.points;
  state.customTasks[dayKey].splice(customIdx, 1);
  saveState();
  renderWeek(state.currentWeek);
}

function updateStreak() {
  var streak = 0, completedDays = 0;
  for (var di = 0; di < CONFIG.days.length; di++) {
    var day = CONFIG.days[di];
    var dayKey = day.date + "-" + day.day;
    var dayState = state.dayStates[dayKey];
    var customTasks = state.customTasks[dayKey] || [];
    var totalCount = day.tasks.length + customTasks.length;
    if (totalCount === 0) continue;
    var fixedDone = 0, customDone = 0;
    for (var ti = 0; ti < day.tasks.length; ti++) {
      if (dayState && dayState.tasks[ti] === 2) fixedDone++;
    }
    for (var ci = 0; ci < customTasks.length; ci++) {
      if (customTasks[ci].timerState === 2) customDone++;
    }
    if (fixedDone + customDone >= 6 && totalCount > 0) { completedDays++; streak++; }
  }
  state.streak = streak;
  state.completedDays = completedDays;
}

function updateCountdown() {
  var diff = CONFIG.examDate - new Date();
  document.getElementById("countdown").textContent = Math.max(1, Math.ceil(diff / 86400000)) + "天";
}

// ============ 渲染 ============
function renderDayCard(day) {
  var dayKey = day.date + "-" + day.day;
  var dayState = state.dayStates[dayKey] || {tasks:{}};
  var customTasks = state.customTasks[dayKey] || [];

  var completedCount = 0, earnedPoints = 0;
  var totalDur = 0, doneDur = 0;

  for (var ti = 0; ti < day.tasks.length; ti++) {
    var ts = dayState.tasks[ti] || 0;
    if (ts === 2) { completedCount++; earnedPoints += day.tasks[ti].points; }
  }
  for (var ci = 0; ci < customTasks.length; ci++) {
    if (customTasks[ci].timerState === 2) { completedCount++; earnedPoints += customTasks[ci].points; }
  }

  var totalCount = day.tasks.length + customTasks.length;
  var percent = totalCount > 0 ? (completedCount / totalCount * 100) : 0;
  var isCompleted = totalCount === 0 || (completedCount >= 6 && completedCount > 0);
  var isExamDay = !!day.specialCheer && day.type === "exam";
  var isLastDay = !!day.specialCheer && day.type === "last";
  var cardClass = isCompleted ? "completed" : "";
  if (isExamDay) cardClass = "exam-day";
  else if (isLastDay) cardClass = "special-day";

  var badgesHtml = day.badges.map(function(b) {
    var cls = "class";
    if (b.indexOf("模考") !== -1) cls = "exam";
    else if (b.indexOf("冲刺课") !== -1) cls = "sprint";
    else if (b.indexOf("最后") !== -1) cls = "exam";
    else if (b.indexOf("考试日") !== -1) cls = "school";
    return "<span class=\"day-badge " + cls + "\">" + b + "</span>";
  }).join("");

  var progressHtml = totalCount > 0
    ? ("<div class=\"date-progress-mini\"><strong>" + completedCount + "</strong>/" + totalCount + " 完成 | +" + earnedPoints + "分</div>")
    : "";

  var html = "<div class=\"day-card " + cardClass + "\">" +
    "<div class=\"date-row\">" +
      "<div class=\"date-info\">" +
        "<span class=\"date-text\">" + day.date + "</span>" +
        "<span class=\"weekday-text\">" + day.day + "</span>" +
        badgesHtml +
      "</div>" +
      progressHtml +
    "</div>";

  if (day.specialCheer) {
    if (day.specialCheer.cheerKind === "exam") {
      // 6/27 考试日 - 可点击切换鼓励语
      var examMsgIdx = state.examCheerIdx !== undefined ? state.examCheerIdx : 0;
      html += "<div class=\"big-cheer exam-cheer\" id=\"examCheerBox\">" +
        "<span class=\"big-emoji\">" + day.specialCheer.emoji + "</span>" +
        "<div class=\"big-text\" id=\"examCheerMain\">" + day.specialCheer.text + "</div>" +
        "<div class=\"sub-text\" id=\"examCheerSub\">" + day.specialCheer.sub + "</div>" +
        "<button class=\"exam-cheer-btn\" id=\"examCheerBtn\" onclick=\"rotateExamCheer()\">" +
          "🍀 再来一句鼓励！</button>" +
      "</div>";
    } else {
      // 6/26 最后一天 - 静态加油卡
      html += "<div class=\"big-cheer\">" +
        "<span class=\"big-emoji\">" + day.specialCheer.emoji + "</span>" +
        "<div class=\"big-text\">" + day.specialCheer.text + "</div>" +
        "<div class=\"sub-text\">" + day.specialCheer.sub + "</div>" +
      "</div>";
    }
  } else if (day.cheer) {
    html += "<div class=\"cheer-msg\"><span class=\"cheer-emoji\">💌</span> " + day.cheer + "</div>";
  }

  if (totalCount > 0 || day.tasks.length > 0) {
    var sections = {};
    var sectionOrder = ["校内","英语","数思","其他"];
    var sectionIcons = {"校内":"🏫","英语":"🇬🇧","数思":"🧮","其他":"📌"};
    var sectionCss = {"校内":"sec-school","英语":"sec-english","数思":"sec-math","其他":"sec-other"};

    for (var si = 0; si < day.tasks.length; si++) {
      var task = day.tasks[si];
      var sec = task.section || "其他";
      if (!sections[sec]) sections[sec] = [];
      sections[sec].push({text:task.text, points:task.points, idx:si, isCustom:false});
    }
    for (var ci2 = 0; ci2 < customTasks.length; ci2++) {
      var ct = customTasks[ci2];
      var ctSec = ct.section || "其他";
      if (!sections[ctSec]) sections[ctSec] = [];
      sections[ctSec].push({text:ct.text, points:ct.points, idx:"custom_" + ci2, isCustom:true, ct:ct});
    }
    if (!sections["其他"]) sections["其他"] = [];

    for (var si2 = 0; si2 < sectionOrder.length; si2++) {
      var secName = sectionOrder[si2];
      if (!sections[secName]) continue;
      var cssClass = sectionCss[secName] || "sec-other";
      var icon = sectionIcons[secName] || "📌";

      html += "<div class=\"task-section " + cssClass + "\">" +
        "<div class=\"task-section-header\">" +
          "<span class=\"section-icon\">" + icon + "</span>" + secName +
        "</div>" +
        "<div class=\"task-row\">";

      for (var ti2 = 0; ti2 < sections[secName].length; ti2++) {
        var task = sections[secName][ti2];
        var done, inProg, timerHtml = "";
        if (task.isCustom) {
          done = task.ct.timerState === 2;
          inProg = task.ct.timerState === 1;
          if (inProg) {
            timerHtml = "<span class=\"task-timer\" data-day=\"" + dayKey + "\" data-idx=\"" + task.idx.replace("custom_","") + "\" data-custom=\"1\">" +
              "<span class=\"timer-start\">开始</span>" +
              "<span class=\"timer-elapsed\">0秒</span>" +
              "<span class=\"timer-label\">计时中</span>" +
            "</span>";
          } else if (done) {
            var dur = task.ct.endTime - task.ct.startTime;
            var ctEndStr = task.ct.endTime ? formatTime(task.ct.endTime) : "--:--";
            var ctStartStr = task.ct.startTime ? formatTime(task.ct.startTime) : "--:--";
            timerHtml = "<span class=\"task-done-time\">" +
              "<span class=\"done-times\">" + ctStartStr + " → " + ctEndStr + "</span>" +
              "<span class=\"done-dur\">" + formatDuration(dur) + "</span>" +
            "</span>";
          }
        } else {
          var ts = dayState.tasks[task.idx] || 0;
          done = ts === 2;
          inProg = ts === 1;
          if (inProg) {
            timerHtml = "<span class=\"task-timer\" data-day=\"" + dayKey + "\" data-idx=\"" + task.idx + "\" data-custom=\"0\">" +
              "<span class=\"timer-start\">开始</span>" +
              "<span class=\"timer-elapsed\">0秒</span>" +
              "<span class=\"timer-label\">计时中</span>" +
            "</span>";
          } else if (done && dayState.tasks[task.idx + "_dur"]) {
            var ts_end = dayState.tasks[task.idx + "_endTime"];
            var ts_start2 = dayState.tasks[task.idx + "_start"];
            var ts_start_str2 = ts_start2 ? formatTime(ts_start2) : "--:--";
            var ts_end_str = ts_end ? formatTime(ts_end) : "--:--";
            timerHtml = "<span class=\"task-done-time\">" +
              "<span class=\"done-times\">" + ts_start_str2 + " → " + ts_end_str + "</span>" +
              "<span class=\"done-dur\">" + formatDuration(dayState.tasks[task.idx + "_dur"]) + "</span>" +
            "</span>";
          }
        }

        var cls = done ? "done" : inProg ? "in-progress" : "";
        var clickHandler = task.isCustom
          ? "onclick=\"toggleCustomTask('" + dayKey + "'," + task.idx.replace("custom_","") + ")\""
          : "onclick=\"toggleTask('" + dayKey + "'," + task.idx + "," + task.points + ")\"";
        var delBtn = task.isCustom
          ? ("<span style=\"cursor:pointer;color:#e74c3c;font-size:0.85em;margin-left:4px;\" onclick=\"event.stopPropagation();removeCustomTask('" + dayKey + "'," + task.idx.replace("custom_","") + ")\">✕</span>")
          : "";

        html += "<div class=\"task-item " + cls + "\" " + clickHandler + ">" +
          "<span class=\"task-check\"></span>" +
          "<span class=\"task-text\">" + task.text + "</span>" +
          "<span class=\"task-points\">+" + task.points + "</span>" +
          timerHtml +
          delBtn +
        "</div>";
      }

      if (secName === "其他") {
        html += "</div><div class=\"custom-task-input\">" +
          "<select id=\"customCat_" + dayKey + "\" style=\"padding:6px 8px;border-radius:8px;border:1.5px solid #ddd;font-size:0.9em;\">" +
            "<option value=\"校内\">校内</option>" +
            "<option value=\"英语\">英语</option>" +
            "<option value=\"数思\">数思</option>" +
            "<option value=\"其他\" selected>其他作业</option>" +
          "</select>" +
          "<input type=\"text\" id=\"customText_" + dayKey + "\" placeholder=\"填写完成内容\">" +
          "<input type=\"number\" id=\"customPts_" + dayKey + "\" placeholder=\"积分\" min=\"1\" max=\"50\" value=\"5\">" +
          "<button class=\"custom-add-btn\" onclick=\"addCustomTask('" + dayKey + "')\">+添加</button>" +
        "</div>";
      } else {
        html += "</div>";
      }
      html += "</div>";
    }

    if (totalCount > 0) {
      html += "<div class=\"day-progress\">" +
        "<div class=\"progress-bar\">" +
          "<div class=\"progress-fill " + (isCompleted ? "complete" : "") + "\" style=\"width:" + percent + "%\"></div>" +
        "</div>" +
      "</div>";
    }

    var doneCount2 = 0;
    for (var t2 = 0; t2 < day.tasks.length; t2++) {
      if (dayState.tasks[t2] === 2) doneCount2++;
    }
    var customDone2 = 0;
    for (var c2 = 0; c2 < customTasks.length; c2++) {
      if (customTasks[c2].timerState === 2) customDone2++;
    }
    var doneAll = doneCount2 + customDone2;
    var inProgCnt = 0;
    for (var t3 = 0; t3 < day.tasks.length; t3++) {
      if (dayState.tasks[t3] === 1) inProgCnt++;
    }
    for (var c3 = 0; c3 < customTasks.length; c3++) {
      if (customTasks[c3].timerState === 1) inProgCnt++;
    }
    if (doneAll > 0 || inProgCnt > 0) {
      var ip = inProgCnt > 0 ? (" | <span style=\"color:#ff9800\">" + inProgCnt + "项进行中</span>") : "";
      html += "<div class=\"day-summary\">" +
        "⏱ 本日学习：<span class=\"summary-value\">" + totalCount + "</span>项 | 已完成" + doneAll + "项" + ip +
      "</div>";
    }
  }

  html += "</div>";
  return html;
}

function renderWeek(weekNum) {
  var weekDays = [];
  for (var i = 0; i < CONFIG.days.length; i++) {
    if (CONFIG.days[i].week === weekNum) weekDays.push(CONFIG.days[i]);
  }
  document.getElementById("weekContent").innerHTML = "";
  for (var j = 0; j < weekDays.length; j++) {
    document.getElementById("weekContent").innerHTML += renderDayCard(weekDays[j]);
  }
}

function renderWeekTabs() {
  var weekMap = {};
  for (var i = 0; i < CONFIG.days.length; i++) {
    var w = CONFIG.days[i].week;
    if (!weekMap[w]) weekMap[w] = true;
  }
  var weeks = [];
  for (var k in weekMap) weeks.push(parseInt(k));
  weeks.sort(function(a,b){return a-b;});

  var html = "";
  for (var i2 = 0; i2 < weeks.length; i2++) {
    var w = weeks[i2];
    html += "<button class=\"week-tab " + (state.currentWeek === w ? "active" : "") + "\" onclick=\"switchWeek(" + w + ")\">第" + w + "周</button>";
  }
  document.getElementById("weekTabs").innerHTML = html;
}

function switchWeek(weekNum) {
  state.currentWeek = weekNum;
  renderWeekTabs();
  renderWeek(weekNum);
}

function updateTimers() {
  var now = Date.now();
  var timerEls = document.querySelectorAll("[data-day]");
  for (var ti = 0; ti < timerEls.length; ti++) {
    var el = timerEls[ti];
    var dayKey = el.getAttribute("data-day");
    var taskIdx = parseInt(el.getAttribute("data-idx"));
    var isCustom = el.getAttribute("data-custom") === "1";
    var startTime = null;
    if (isCustom) {
      var ct = state.customTasks[dayKey] && state.customTasks[dayKey][taskIdx];
      if (ct && ct.timerState === 1 && ct.startTime) startTime = ct.startTime;
    } else {
      var ds = state.dayStates[dayKey];
      if (ds && ds.tasks[taskIdx] === 1 && ds.tasks[taskIdx + "_start"]) startTime = ds.tasks[taskIdx + "_start"];
    }
    var children = el.children;
    for (var ci = 0; ci < children.length; ci++) {
      if (children[ci].classList.contains("timer-elapsed")) {
        children[ci].textContent = startTime ? formatDuration(now - startTime) : formatDuration(0);
        break;
      }
    }
  }
}
function redeemReward(rewardId) {
  var reward = null;
  for (var ri = 0; ri < REWARDS.length; ri++) {
    if (REWARDS[ri].id === rewardId) { reward = REWARDS[ri]; break; }
  }
  if (!reward) return;
  var available = getAvailablePoints();
  if (available < reward.cost) {
    alert("积分不足！需要 " + reward.cost + " 积分，当前可用 " + available + " 积分");
    return;
  }
  if (!confirm("确定要用 " + reward.cost + " 积分兑换「" + reward.name + "」吗？")) return;
  state.spentPoints += reward.cost;
  var dateStr = new Date().toLocaleDateString("zh-CN") + " " +
    (new Date().getHours() + "").padStart(2,"0") + ":" +
    (new Date().getMinutes() + "").padStart(2,"0");
  state.redeemHistory.unshift({
    rewardId: reward.id,
    name: reward.name,
    icon: reward.icon,
    cost: reward.cost,
    date: dateStr
  });
  saveState();
  updateStats();
  renderRewards();
  alert("🎉 兑换成功！「" + reward.name + "」记得找妈妈兑现哦！");
}

var EXAM_CHEERS = [
  {main:"相信自己，你行的！",sub:"正常发挥就是超常发挥！去征服那张试卷吧！💪✨"},
  {main:"你准备好了！",sub:"所有的努力都不会白费，今天就是证明自己的时候！🌟"},
  {main:"南外在等你！",sub:"沉着冷静，把你会做的都做对，就赢了！🎯"},
  {main:"加油！你最棒！",sub:"相信自己，稳扎稳打，胜利属于你！🏆"},
  {main:"放轻松，正常发挥！",sub:"题目的难度对每个人都一样，你只管专注自己！🍀"},
  {main:"冲鸭！必胜！",sub:"奋笔疾书，梦想就在眼前！冲啊！🚀"},
  {main:"发挥你的全部！",sub:"不管结果如何，为努力过的自己骄傲！💖"},
  {main:"稳住，我们能赢！",sub:"一步一步来，你一定可以的！✨"}
];

function rotateExamCheer() {
  var idx = (state.examCheerIdx !== undefined ? state.examCheerIdx : 0);
  idx = (idx + 1) % EXAM_CHEERS.length;
  state.examCheerIdx = idx;
  saveState();
  var c = EXAM_CHEERS[idx];
  var mainEl = document.getElementById("examCheerMain");
  var subEl = document.getElementById("examCheerSub");
  if (mainEl) mainEl.textContent = c.main;
  if (subEl) subEl.textContent = c.sub;
  // 点一下按钮文字也变一下
  var btnEl = document.getElementById("examCheerBtn");
  if (btnEl) btnEl.textContent = "🍀 " + EXAM_CHEERS[(idx+1)%EXAM_CHEERS.length].main.slice(0,6) + "…";
}

function renderRewards() {
  var available = getAvailablePoints();
  var small = REWARDS.filter(function(r){ return r.cat === "small"; });
  var medium = REWARDS.filter(function(r){ return r.cat === "medium"; });
  var large = REWARDS.filter(function(r){ return r.cat === "large"; });

  function makeGrid(rewards) {
    var html = "";
    for (var ri = 0; ri < rewards.length; ri++) {
      var r = rewards[ri];
      var canAfford = available >= r.cost;
      html += '<div class="reward-card">' +
        '<div class="reward-icon">' + r.icon + '</div>' +
        '<div class="reward-name">' + r.name + '</div>' +
        '<div class="reward-cost">' + r.cost + '分</div>' +
        '<div class="reward-desc">' + r.desc + '</div>' +
        '<button class="reward-btn" ' + (canAfford ? 'onclick="redeemReward(\'' + r.id + '\')"' : 'disabled') + '>' +
        (canAfford ? "兑换" : "积分不足") + '</button>' +
        '</div>';
    }
    return html;
  }

  document.getElementById("rewardGridSmall").innerHTML = makeGrid(small);
  document.getElementById("rewardGridMedium").innerHTML = makeGrid(medium);
  document.getElementById("rewardGridLarge").innerHTML = makeGrid(large);

  // 兑换记录
  if (state.redeemHistory.length === 0) {
    document.getElementById("redeemHistory").innerHTML = '<div class="empty-state" style="padding:20px;"><div>还没有兑换记录</div></div>';
  } else {
    var histHtml = "";
    for (var hi = 0; hi < state.redeemHistory.length; hi++) {
      var h = state.redeemHistory[hi];
      histHtml += '<div class="history-item">' +
        '<span class="hi-name">' + h.icon + ' ' + h.name + '</span>' +
        '<span class="hi-cost">-' + h.cost + '</span>' +
        '<span class="hi-date">' + h.date + '</span>' +
        '</div>';
    }
    document.getElementById("redeemHistory").innerHTML = histHtml;
  }
}

function init() {
  loadState();
  updateStats();
  updateCountdown();
  renderWeekTabs();
  renderWeek(state.currentWeek);
  setInterval(updateCountdown, 3600000);
  setInterval(updateTimers, 1000);
}

init();
</script>
</body>
